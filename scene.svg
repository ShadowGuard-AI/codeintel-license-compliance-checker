<g><rect x="712" y="160" width="52" height="30" fill="#a62b25"><animateTransform attributeName="transform" type="translate" values="0 0;0 34;0 0;0 0;0 34;0 0" keyTimes="0;0.2;0.3;0.6;0.8;1" dur="16s" repeatCount="indefinite"/></rect></g></g>
